name: Offline maintenance checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run_all_tests.py --group offline
      - run: node --test tests/dashboard_routes.test.cjs
      - run: python tests/test_tool_learning_pipeline.py
      - run: python -m compileall -q brain core tools main.py
  wizard:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt -r requirements-wizard.txt
      - run: python -m pytest -q tests/test_wizard_routes.py tests/test_agent_creation.py::WizardCreationDiagnostics
