<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Subconscious Over-Agent — Desktop Floating Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="widget-mode">

    <!-- FLOATING HELIX AVATAR WIDGET (LAYERED SVG VECTOR MASCOT WITH EXPRESSIONS & MOOD COLOR SHIFTING) -->
    <div id="helix-avatar-widget" class="helix-avatar-container mood-focused" title="Click to toggle Helix Mini-Chat | Drag & Drop Files Here">
        <div class="avatar-pulse-ring"></div>
        <div class="avatar-core">
            <!-- LAYERED SVG VECTOR MASCOT -->
            <svg id="helix-vector-mascot" viewBox="0 0 100 100" class="helix-vector-svg" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="mood-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="var(--mood-primary)" />
                        <stop offset="100%" stop-color="var(--mood-secondary)" />
                    </linearGradient>
                    <filter id="vector-glow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                
                <!-- Layer 1: Outer Pulse Aura -->
                <circle cx="50" cy="50" r="44" stroke="url(#mood-grad-primary)" stroke-width="2" fill="none" class="layer-pulse-aura" />
                
                <!-- Layer 2: Interlocking Helix Strands -->
                <path d="M50 14 C26 14 14 30 14 50 C14 70 26 86 50 86 C74 86 86 70 86 50 C86 30 74 14 50 14 Z" fill="none" stroke="url(#mood-grad-primary)" stroke-width="6" stroke-linecap="round" class="layer-helix-outer" />
                <path d="M50 24 C34 24 24 34 24 50 C24 66 34 76 50 76 C66 76 76 66 76 50 C76 34 66 24 50 24 Z" fill="none" stroke="var(--mood-primary)" stroke-width="4" stroke-linecap="round" class="layer-helix-inner" />
                
                <!-- Layer 3: Blinking Character Eyes (Morphing Expressions) -->
                <g class="layer-eyes">
                    <ellipse id="eye-left" cx="40" cy="44" rx="3.5" ry="4.5" fill="var(--text-main)" class="svg-eye" />
                    <ellipse id="eye-right" cx="60" cy="44" rx="3.5" ry="4.5" fill="var(--text-main)" class="svg-eye" />
                </g>
                
                <!-- Layer 4: Smiling Mouth (Morphing Expressions) -->
                <path d="M44 56 Q50 61 56 56" fill="none" stroke="var(--text-main)" stroke-width="2.5" stroke-linecap="round" class="layer-mouth" />
                
                <!-- Layer 5: Pulsing Center Core -->
                <circle cx="50" cy="50" r="5" fill="var(--mood-primary)" filter="url(#vector-glow)" class="layer-core-node" />
            </svg>
        </div>
        <div class="avatar-speech-bubble" id="avatar-speech-bubble">
            <span id="speech-bubble-text">Helix Subconscious Stream active...</span>
        </div>
        <div class="dropzone-overlay" id="avatar-dropzone">
            <div class="drop-icon">✨</div>
            <div class="drop-text">Feed File to Helix</div>
        </div>
    </div>

    <!-- FLOATING MINI-CHAT DRAWER -->
    <div id="mini-chat-drawer" class="mini-chat-container hidden">
        <div class="drawer-header">
            <div class="drawer-title">
                <span class="status-dot online"></span>
                <span class="title-text">Helix Subconscious Mind</span>
                <span class="hotkey-badge">Alt + Space</span>
            </div>
            <div class="drawer-actions">
                <button id="btn-toggle-app-mode" class="icon-btn" title="Toggle Full App View">🗖</button>
                <button id="btn-close-drawer" class="icon-btn" title="Minimize Drawer">✕</button>
            </div>
        </div>

        <div class="affect-indicator-bar" id="affect-bar">
            <span class="affect-label">Synthetic Mood:</span>
            <span class="affect-val" id="affect-status">Deeply Focused & Analytical</span>
        </div>

        <div class="chat-feed" id="chat-feed">
            <div class="message system-msg">
                <div class="msg-author">Helix Executive Engine</div>
                <div class="msg-content">Subconscious event stream active. Ask a question or drag & drop documents/images here to ingest.</div>
            </div>
        </div>

        <!-- AUDIO SPECTRUM VISUALIZER -->
        <div class="audio-waveform-container hidden" id="audio-waveform">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>

        <!-- INPUT ACTION TOOLBAR -->
        <div class="action-toolbar">
            <button id="btn-paste-clipboard" class="tool-chip" title="Attach copied text from clipboard">📋 Clipboard</button>
            <button id="btn-crop-snippet" class="tool-chip" title="Capture screen snippet OCR">📸 Screen Crop</button>
            <label for="file-input-upload" class="tool-chip file-upload-chip" title="Upload document or image">
                📁 Upload File
                <input type="file" id="file-input-upload" multiple hidden>
            </label>
        </div>

        <!-- PROMPT INPUT BAR -->
        <div class="input-bar">
            <textarea id="user-input-field" placeholder="Type prompt or command (Alt+Space to focus)..." rows="1"></textarea>
            <button id="btn-send-prompt" class="btn-send" title="Send Prompt">➔</button>
        </div>
    </div>

    <script src="expressions.js"></script>
    <script src="app.js"></script>
</body>
</html>
